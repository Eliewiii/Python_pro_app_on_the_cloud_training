[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradual-productionization"
dynamic = ["version"]
description = "PhD R&D to Cloud Production pipeline"
requires-python = ">=3.12"

[tool.hatch.version]
path = "core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["core", "app"]

[tool.pytest.ini_options]
pythonpath = "."

testpaths = [
    "tests/unit",
    "tests/integration",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "INFO"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: Error, F: Pyflakes, B: Bugbear
select = ["E", "F", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"