[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradual-productionization"
version = "0.1.0"
description = "PhD R&D to Cloud Production pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: Error, F: Pyflakes, B: Bugbear
select = ["E", "F", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"