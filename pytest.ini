[pytest]
# 1. Force the root directory into the Python Path
pythonpath = .

# 2. Tell pytest exactly where to look for tests
testpaths = tests/unit tests/integration

# 3. Define the naming standard for discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 4. Enable log output during tests (helpful for your warning logic)
log_cli = true
log_cli_level = INFO